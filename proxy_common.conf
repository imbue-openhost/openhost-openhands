# Shared proxy directives for the OpenHands upstream.
#
# The OpenHost router strips the original Host header (the app sees
# Host: 127.0.0.1:8080). OpenHands' CORS middleware special-cases
# localhost and it trusts x-forwarded headers; we forward the real
# external host + https scheme so any absolute URLs are correct.

proxy_http_version 1.1;

# WebSocket / connection-upgrade plumbing. OpenHands streams the agent
# conversation over Socket.IO at /socket.io, using the websocket
# transport only (no long-polling fallback), so the upgrade MUST be
# passed through. $connection_upgrade is "upgrade" when the client
# sends an Upgrade header, else "close".
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Pass the external-facing host + scheme through to OpenHands.
proxy_set_header Host              $forward_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $forward_host;

# Don't buffer streaming responses; agent runs hold connections open
# for a long time and the Socket.IO stream must not be buffered.
proxy_buffering off;
proxy_request_buffering off;
